version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-cms-postgres
    environment:
      POSTGRES_DB: portfolio_cms
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: portfolio-cms-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/portfolio_cms
      MEDIA_DRIVER: cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      ADMIN_EMAIL: admin@paulocardoso.dev
      ADMIN_PASSWORD: admin
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4001:4000"
    restart: unless-stopped

volumes:
  pg_data: